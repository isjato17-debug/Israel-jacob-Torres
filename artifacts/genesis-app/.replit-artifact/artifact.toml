kind = "web"
previewPath = "/"
title = "B.I.G. — Business Inside Genesis"
description = "Business Inside Genesis, powered by Genesis OS 2.0: saved business planning, Mission Control and a clearly labeled no-cost consultation simulation."
version = "1.0.0"
id = "artifacts/genesis-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19183

[services.development]
run = "pnpm --filter @workspace/genesis-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/genesis-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/genesis-app/dist/public"

[[services.production.rewrites]]
from = "/next"
to = "/next/index.html"

[[services.production.rewrites]]
from = "/next/*"
to = "/next/index.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19183"
BASE_PATH = "/"
